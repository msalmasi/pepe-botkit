[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcp-schemas"
version = "0.1.0"
description = "JSON Schemas and a validator for PCP (Pepe Connector Protocol) frames."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "jsonschema[format-nongpl]>=4.18",
  "referencing>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["pcp_schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
